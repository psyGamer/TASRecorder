      #     tar xzf nv-codec-headers-${{ env.NVCODEC_VERSION }}.tar.gz
      #     cd nv-codec-headers-${{ env.NVCODEC_VERSION }}

      #     make install PREFIX=${{ env.PREFIX }}

      # # AMD Advanced Media Framework
      # - name: Install AMD Advanced Media Framework headers (non-macOS)
      #   if: ${{ matrix.platform != 'macos' }}
      #   run: |
      #     curl --retry 5 -o amf-headers-v${{ env.AMF_VERSION }}.tar.gz -L https://github.com/GPUOpen-LibrariesAndSDKs/AMF/releases/download/v${{ env.AMF_VERSION }}/AMF-headers-v${{ env.AMF_VERSION }}.tar.gz
      #     tar xzf amf-headers-v${{ env.AMF_VERSION }}.tar.gz
      #     cd amf-headers-v${{ env.AMF_VERSION }}

      #     cp -r AMF ${{ env.PREFIX }}/include

      # FFmpeg
      - name: Build FFmpeg
        run: |
          curl --retry 5 -O -L https://ffmpeg.org/releases/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.gz
          tar xzf ffmpeg-${{ env.FFMPEG_VERSION }}.tar.gz
          cd ffmpeg-${{ env.FFMPEG_VERSION }}

          CONFIGURE_FLAGS=(
            --prefix=${{ env.PREFIX }}

            --disable-autodetect
            --disable-everything
            --enable-gpl

            # Containers
            --enable-muxer=mp4
            --enable-muxer=matroska
            --enable-muxer=mov
            --enable-muxer=webm

            # x264
            --enable-libx264
            --enable-encoder=libx264
            --enable-encoder=libx264rgb
            --enable-parser=h264
            --enable-parser=hevc

            # libvpx
            --enable-libvpx
            --enable-encoder=libvpx_vp8
            --enable-parser=vp8
            --enable-encoder=libvpx_vp9
            --enable-parser=vp9

            # SVT-AV1
            --enable-libsvtav1
            --enable-encoder=libsvtav1
            --enable-parser=av1

            # LAME
            --enable-libmp3lame
            --enable-encoder=aac
            --enable-encoder=libmp3lame
            --enable-parser=aac
            --enable-parser=mpegaudio

            # FLAC
            --enable-encoder=flac
            --enable-parser=flac

            # Opus
            --enable-libopus
            --enable-encoder=libopus
            --enable-parser=opus

            # Vorbis
            --enable-libvorbis
            --enable-encoder=libvorbis
            --enable-parser=vorbis

            # Input
            --enable-decoder=rawvideo
            --enable-demuxer=rawvideo
            --enable-decoder=pcm_s16le
            --enable-demuxer=pcm_s16le

            # Output
            --enable-bsf=h264_mp4toannexb
            --enable-bsf=aac_adtstoasc

            --enable-filter=format
            --enable-filter=hwupload
            --enable-filter=scale

            --enable-protocol=pipe
            --enable-protocol=file

            # Vulkan Hardware Acceleration
            --enable-vulkan
            --enable-encoder=h264_vulkan
            --enable-encoder=hevc_vulkan

            # Compilation
            --enable-ffmpeg
            --enable-avcodec
            --enable-avformat
            --enable-avutil
            --enable-swscale
            --enable-swscale-alpha
            --enable-swresample

            --disable-ffplay
            --disable-ffprobe
            --disable-debug
            --disable-doc
            --disable-htmlpages
            --disable-manpages
            --disable-podpages
            --disable-txtpages

            --enable-pic
            --enable-static
            --disable-shared
            --disable-x86asm

            --pkg-config-flags="--static"
            --extra-cflags="-I${{ env.PREFIX }}/include"
            --extra-ldflags="-L${{ env.PREFIX }}/lib -static"
          )

          # Link against shlwapi on Windows
          if [ "x${{ runner.os }}" = "xWindows" ]; then
            CONFIGURE_FLAGS+=(--extra-libs="-lshlwapi -lmpg123 -static")
          else
            CONFIGURE_FLAGS+=(--extra-libs="-lmpg123 -static")
          fi

          # Enable DRM backend for Linux
          if [ "x${{ runner.os }}" = "xLinux" ]; then
            CONFIGURE_FLAGS+=(--enable-libdrm)
          fi

          # Enable vendor-specific Hardware Acceleration
          if [ "x${{ runner.os }}" != "xmacOS" ]; then
            CONFIGURE_FLAGS+=(
              # Intel QSV Hardware Acceleration
              --enable-libvpl
              --enable-encoder=h264_qsv
              --enable-encoder=hevc_qsv

              # NVIDIA NVENC Hardware Acceleration
              --enable-ffnvcodec
              --enable-nvenc
              --enable-encoder=h264_nvenc
              --enable-encoder=hevc_nvenc

              # AMD AMF Hardware Acceleration
              --enable-amf
              --enable-encoder=h264_amf
              --enable-encoder=hevc_amf
            )
          else
            CONFIGURE_FLAGS+=(
              # Apple Video Toolbox
              --enable-videotoolbox
              --enable-encoder=h264_videotoolbox
              --enable-encoder=hevc_videotoolbox

              # Apple Audio Toolbox
              --enable-audiotoolbox
              --enable-encoder=aac_at
            )
          fi

          # Use AppleClang on macOS, otherwise GCC
          if [ "x${{ runner.os }}" = "xmacOS" ]; then
            CONFIGURE_FLAGS+=(--cc=clang)
          else
            CONFIGURE_FLAGS+=(--cc=gcc)
          fi

          CFLAGS="${{ env.CFLAGS }}"
          PKG_CONFIG_PATH=${{ env.PREFIX }}/lib/pkgconfig
          if ! ./configure "${CONFIGURE_FLAGS[@]}"; then
            echo "==== /prefix tree ===="
            find ${{ env.PREFIX }} || true
            echo "==== ffbuild/config.mak ===="
            cat ffbuild/config.mak || true
            echo "==== ffbuild/config.log ===="
            cat ffbuild/config.log || true
            exit 1
          fi

          make install -j$(nproc)

      - name: Create ffmpeg.dll (Windows)
        if: ${{ matrix.platform == 'windows' }}
        run: |
          g++ -shared \
            "${{ env.PREFIX }}/lib/libavutil.a" \
            "${{ env.PREFIX }}/lib/libavcodec.a" \
            "${{ env.PREFIX }}/lib/libavformat.a" \
            "${{ env.PREFIX }}/lib/libswresample.a" \
            "${{ env.PREFIX }}/lib/libswscale.a" \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libavutil.a"     | grep -E '^av(util)?_'     | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libavcodec.a"    | grep -E '^av(codec)?_'    | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libavformat.a"   | grep -E '^av(format)?_'   | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libswresample.a" | grep -E '^swr(esample)?_' | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libswscale.a"    | grep -E '^sws(cale)?_'    | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            -L"${{ env.PREFIX }}/lib" \
              -lx264 \
              -lvpx \
              -lSvtAv1Enc \
              -lmpg123 \
              -lmp3lame \
              -logg \
              -lopus \
              -lvorbis \
              -lvorbisenc \
              -lvorbisfile \
              -lvpl \
            -lshlwapi -lws2_32 -lbcrypt -lole32 -lgdi32 -luuid \
            -static-libstdc++ -static-libgcc \
            -Wl,-Bstatic -l:libwinpthread.a -Wl,-Bdynamic \
            -o "${{ env.PREFIX }}/bin/ffmpeg.dll"

      - name: Create libffmpeg.dylib (macOS)
        if: ${{ matrix.platform == 'macos' }}
        run: |
          clang -dynamiclib \
            -Wl,-install_name,@rpath/libffmpeg.dylib \
            "${{ env.PREFIX }}/lib/libavutil.a" \
            "${{ env.PREFIX }}/lib/libavcodec.a" \
            "${{ env.PREFIX }}/lib/libavformat.a" \
            "${{ env.PREFIX }}/lib/libswresample.a" \
            "${{ env.PREFIX }}/lib/libswscale.a" \
            $(nm -gU "${{ env.PREFIX }}/lib/libavutil.a"     | grep -E '^_?av(util)?_'     | sed 's/^_//' | awk '{print "-Wl,-u,_"$1}') \
            $(nm -gU "${{ env.PREFIX }}/lib/libavcodec.a"    | grep -E '^_?av(codec)?_'    | sed 's/^_//' | awk '{print "-Wl,-u,_"$1}') \
            $(nm -gU "${{ env.PREFIX }}/lib/libavformat.a"   | grep -E '^_?av(format)?_'   | sed 's/^_//' | awk '{print "-Wl,-u,_"$1}') \
            $(nm -gU "${{ env.PREFIX }}/lib/libswresample.a" | grep -E '^_?swr(esample)?_' | sed 's/^_//' | awk '{print "-Wl,-u,_"$1}') \
            $(nm -gU "${{ env.PREFIX }}/lib/libswscale.a"    | grep -E '^_?sws(cale)?_'    | sed 's/^_//' | awk '{print "-Wl,-u,_"$1}') \
            -L"${{ env.PREFIX }}/lib" \
              -lx264 \
              -lvpx \
              -lSvtAv1Enc \
              -lmpg123 \
              -lmp3lame \
              -logg \
              -lopus \
              -lvorbis \
              -lvorbisenc \
              -lvorbisfile \
              -lvpl \
            -lc++ \
            -o "$${{ env.PREFIX }}/lib/libffmpeg.dylib"

      - name: Create libffmpeg.so (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: |
          gcc -shared \
            -Wl,-soname,libffmpeg.so \
            "${{ env.PREFIX }}/lib/libavutil.a" \
            "${{ env.PREFIX }}/lib/libavcodec.a" \
            "${{ env.PREFIX }}/lib/libavformat.a" \
            "${{ env.PREFIX }}/lib/libswresample.a" \
            "${{ env.PREFIX }}/lib/libswscale.a" \
            -Wl,--whole-archive \
              $(gcc -print-file-name=libstdc++.a) \
              $(gcc -print-file-name=libgcc_eh.a) \
            -Wl,--no-whole-archive \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libavutil.a"     | grep -E '^av(util)?_'     | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libavcodec.a"    | grep -E '^av(codec)?_'    | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libavformat.a"   | grep -E '^av(format)?_'   | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libswresample.a" | grep -E '^swr(esample)?_' | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            $(nm -g --defined-only --format=posix "${{ env.PREFIX }}/lib/libswscale.a"    | grep -E '^sws(cale)?_'    | awk '$2 ~ /^T|^W$/ {print "-Wl,-u," $1}') \
            -L"${{ env.PREFIX }}/lib" \
              -lx264 \
              -lvpx \
              -lSvtAv1Enc \
              -lmpg123 \
              -lmp3lame \
              -logg \
              -lopus \
              -lvorbis \
              -lvorbisenc \
              -lvorbisfile \
              -lvpl \
              -lpciaccess \
              -ldrm \
              -ldrm_radeon \
              -ldrm_amdgpu \
              -ldrm_intel \
              -ldrm_nouveau \
            -lm -ldl -latomic -pthread \
            /usr/lib/libc.a -lgcc \
            -o "${{ env.PREFIX }}/lib/libffmpeg.so"

      # Upload
      - name: Copy binaries (Windows)
        if: ${{ matrix.platform == 'windows' }}
        run: |
          cp ${{ env.PREFIX }}/bin/ffmpeg.exe ffmpeg.exe
          cp ${{ env.PREFIX }}/bin/ffmpeg.dll ffmpeg.dll

      - name: Copy binaries (macOS)
        if: ${{ matrix.platform == 'macos' }}
        run: |
          cp ${{ env.PREFIX }}/bin/ffmpeg ffmpeg
          cp ${{ env.PREFIX }}/lib/libffmpeg.dylib libffmpeg.dylib

      - name: Copy binaries (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: |
          cp ${{ env.PREFIX }}/bin/ffmpeg ffmpeg
          cp ${{ env.PREFIX }}/lib/libffmpeg.so libffmpeg.so

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v7
        if: ${{ matrix.platform == 'windows' }}
        with:
          name: ffmpeg-win-${{ matrix.msys2_env == 'x86_64' && 'x86_64' || 'x86' }}
          path: |
            ffmpeg.exe
            ffmpeg.dll

      - name: Upload Artifacts (macOS)
        uses: actions/upload-artifact@v7
        if: ${{ matrix.platform == 'macos' }}
        with:
          name: ffmpeg-osx-x86_64
          path: |
            ffmpeg
            libffmpeg.dylib

      - name: Upload Artifacts (Linux)
        uses: actions/upload-artifact@v7
        if: ${{ matrix.platform == 'linux' }}
        with:
          name: ffmpeg-linux-x86_64
          path: |
            ffmpeg
            libffmpeg.so
