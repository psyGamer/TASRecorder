name: Build FFmpeg

on:
  push:
    paths:
      - .github/workflows/build-ffmpeg.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  X264_REVISION: "b35605ace3ddf7c1a5d67a2eb553f034aef41d55"
  LIBVPX_VERSION: "1.16.0"
  SVTAV1_VERSION: "4.2.0"
  MPG123_VERSION: "1.33.7"
  LAME_VERSION: "4.0"
  OPUS_VERSION: "1.6.1"
  OGG_VERSION: "1.3.6"
  VORBIS_VERSION: "1.3.7"
  LIBVPL_VERSION: "2.17.0"
  LIBPCIACCESS_VERSION: "libpciaccess-0.19"
  LIBDRM_VERSION: "2.4.134"
  LIBVA_VERSION: "2.24.1"
  VULKAN_VERSION: "1.4.360"
  SPIRV_VERSION: "vulkan-sdk-1.4.357.0"
  NVCODEC_VERSION: "13.0.19.1"
  AMF_VERSION: "1.5.2"
  FFMPEG_VERSION: "9.0.1"

  CFLAGS: -O3
  MESON_BUILD_TYPE: release
  CMAKE_BUILD_TYPE: Release

