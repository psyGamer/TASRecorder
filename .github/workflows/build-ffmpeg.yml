          #   msys2_env: x86_64

          # - name: Linux x64
          #   os: ubuntu-latest
          #   platform: linux
          #   container: alpine:latest

          - name: macOS x64
            os: macos-15-intel
            platform: macos

    name: FFmpeg (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    env:
      # Keep support for old macOS versions
      MACOSX_DEPLOYMENT_TARGET: 10.12

    defaults:
      run:
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}

    steps:
      # Setup
      - name: Set up MSVC (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        if: ${{ matrix.platform == 'windows' }}
        with:
          arch: ${{ matrix.msys2_env == 'x86_64' && 'x64' || 'x86' }}

      - name: Set up MSYS2 (Windows)
        uses: msys2/setup-msys2@v2
        if: ${{ matrix.platform == 'windows' }}
        with:
          msystem: ${{ matrix.msys2_system }}
          install: >-
            git
            curl
            make
            diffutils
            mingw-w64-${{ matrix.msys2_env }}-gcc
            mingw-w64-${{ matrix.msys2_env }}-cmake
            mingw-w64-${{ matrix.msys2_env }}-meson
            mingw-w64-${{ matrix.msys2_env }}-ninja
            mingw-w64-${{ matrix.msys2_env }}-nasm
            mingw-w64-${{ matrix.msys2_env }}-pkgconf

      - name: Install dependencies (macOS)
        if: ${{ matrix.platform == 'macos' }}
        shell: sh
        run: brew install bash meson nasm

      - name: Install dependencies (Linux)
        if: ${{ matrix.platform == 'linux' }}
        shell: sh
        run: apk add --no-cache bash musl-dev g++ make cmake ninja meson nasm pkgconfig git curl diffutils perl linux-headers

